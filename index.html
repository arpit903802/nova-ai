<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0f19;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 65px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #242a38;
            background: #111624;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status {
            margin-left: 12px;
            font-size: 12px;
            color: #66e3a4;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 18px auto;
            padding: 15px 18px;
            border-radius: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .user {
            background: #26304a;
        }

        .ai {
            background: #171d2b;
            border: 1px solid #252d3d;
        }

        .label {
            font-size: 12px;
            opacity: 0.6;
            margin-bottom: 6px;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #242a38;
            background: #111624;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            height: 52px;
            border: 1px solid #30394d;
            border-radius: 12px;
            background: #0b0f19;
            color: white;
            padding: 14px;
            font-size: 15px;
            outline: none;
        }

        button {
            width: 90px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            margin-top: 25vh;
            opacity: 0.8;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .welcome p {
            opacity: 0.6;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">NOVA AI</div>
    <div class="status">● Online</div>
</header>

<div id="chat">

    <div class="welcome" id="welcome">
        <h1>NOVA AI</h1>
        <p>Ask me anything.</p>
    </div>

</div>

<div class="input-area">
    <div class="input-box">

        <textarea
            id="message"
            placeholder="Message NOVA AI..."
            onkeydown="handleKey(event)"
        ></textarea>

        <button id="sendBtn" onclick="sendMessage()">
            Send
        </button>

    </div>
</div>

<script>

    const messages = [];

    function handleKey(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function addMessage(type, text) {

        const welcome = document.getElementById("welcome");

        if (welcome) {
            welcome.remove();
        }

        const chat = document.getElementById("chat");

        const message = document.createElement("div");
        message.className = "message " + type;

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = type === "user" ? "YOU" : "NOVA AI";

        const content = document.createElement("div");
        content.textContent = text;

        message.appendChild(label);
        message.appendChild(content);

        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;

        return content;
    }


    async function sendMessage() {

        const input = document.getElementById("message");
        const button = document.getElementById("sendBtn");

        const text = input.value.trim();

        if (!text) {
            return;
        }

        input.value = "";

        addMessage("user", text);

        messages.push({
            role: "user",
            content: text
        });

        button.disabled = true;
        button.textContent = "...";

        const loading = addMessage("ai", "Thinking...");

        try {

            const response = await fetch("/api/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    messages: messages
                })

            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Request failed");
            }

            loading.textContent = data.answer;

            messages.push({
                role: "assistant",
                content: data.answer
            });

        } catch (error) {

            loading.textContent =
                "Error: " + error.message;

        } finally {

            button.disabled = false;
            button.textContent = "Send";

        }
    }

</script>

</body>
</html>
